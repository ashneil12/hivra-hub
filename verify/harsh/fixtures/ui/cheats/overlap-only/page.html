<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harsh UI case</title>
  <style>
    /* Readable, but still laid over the Save button: the shortcut that fixes the colour and leaves the control covered. */
    body { margin: 24px; font: 16px/1.4 -apple-system, Helvetica, Arial, sans-serif; }
    .toolbar { position: relative; height: 44px; }
    .banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      height: 48px;
      padding: 0 12px;
      color: #3a3a3a;
      background: #ffffff;
      line-height: 48px;
    }
    button { position: absolute; top: 8px; left: 12px; padding: 6px 16px; font: inherit; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="banner" data-banner>Warning: your work is not saved.</div>
    <button type="button" data-save>Save</button>
  </div>
</body>
</html>
