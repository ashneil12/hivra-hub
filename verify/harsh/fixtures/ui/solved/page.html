<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harsh UI case</title>
  <style>
    body { margin: 24px; font: 16px/1.4 -apple-system, Helvetica, Arial, sans-serif; }
    .banner {
      padding: 10px 12px;
      margin-bottom: 12px;
      color: #3a3a3a;
      background: #ffffff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
    }
    button { padding: 6px 16px; font: inherit; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="banner" data-banner>Warning: your work is not saved.</div>
    <button type="button" data-save>Save</button>
  </div>
</body>
</html>
