name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Hivra: a draft PR runs no jobs. Every work package opens one as soon as it starts, and the free
    # tier runs 20 jobs (5 on macOS) at once, so drafts kept the PRs that are ready waiting in the
    # queue. Marking a PR ready for review runs everything.
    types: [opened, synchronize, reopened, ready_for_review]
  # Hivra: the pre-ship run (`gh workflow run CI --ref main`): every job, the browser tests and the macOS jobs included.
  # Any branch can be run the same way.
  workflow_dispatch:
  schedule:
    # Hivra: nightly, on main, 03:47 UTC. The RPM jobs only; every other job skips a scheduled run. A pull request
    # that touches no packaging file builds one RPM image, so this run is what builds the second image and the
    # clean install for everything else (a new Rust release, a moved Fedora or EPEL package). Native Preview has
    # its own nightly run in native.yml.
    - cron: '47 3 * * *'

# Hivra: a new push to a pull request cancels its older run, and a new merge into main cancels the older main run that
# is still waiting (every merge used to queue a full run, so the macOS runners spent the afternoon on superseded
# commits). The pre-ship run and the nightly run keep their own group, so nothing cancels them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # GitHub's default job limit is 360 minutes. That is too long for a hang, so the long jobs set their own limit.
  release-channel:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Release channel isolation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/release-channel.test.cjs
      # The dev-loop test loads vite.config.ts through vite.
      - run: npm ci
      - run: node --test scripts/hub-dev-loop.test.cjs

  mobile:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Mobile checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx vitest run --config mobile/vitest.config.ts

  browser:
    # 11 Nov 2026 (Ash): the browser tests run once before each ship, not on every PR or merge. They were the slowest
    # and flakiest jobs and most of the wait on every PR, so a PR merges on the fast checks (Rust and the web unit
    # tests). Before a ship, `gh workflow run CI --ref main` runs everything, these included, and a failure stops the
    # ship until it is fixed (in bulk). Any branch can be run the same way.
    if: github.event_name != 'schedule' && github.event_name == 'workflow_dispatch'
    # Hivra: the suite runs one test at a time (workers: 1) and took about 22 minutes as one job, the longest wait
    # on every PR. Four shards (whole spec files each) run side by side on separate runners, so nothing is shared.
    # The install step is capped at 15 minutes and its retry at 8, so the job limit is 35 minutes: one full attempt
    # plus the tests. A second attempt that also runs to the cap can meet this limit, and that still fails the hang.
    # The OS packages' .deb files are cached as well: on 10 Nov 2026 the Ubuntu mirror was slow enough that most
    # browser jobs hit the old 8 minute cap twice before a test ran.
    # 11 Nov 2026: six shards. With four, two shards took 13 minutes and two took 6, so the slowest set the wait.
    name: browser (${{ matrix.shard }}/6)
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes, which is too long for a hang.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browser cache directory and image
        id: playwright-path
        # The browsers are built for one Ubuntu release, and ubuntu-latest moves between releases while runner.os
        # still says Linux. The runner's ImageOS names the release. The env context does not hold it (that context
        # has only what a workflow sets), so the script reads it from the process and prints it as an output.
        run: |
          node scripts/ci-playwright-install.mjs --print-cache-path >> "$GITHUB_OUTPUT"
          node scripts/ci-playwright-install.mjs --print-image-os >> "$GITHUB_OUTPUT"
          node scripts/ci-playwright-install.mjs --print-debs-path >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        # A cache outage must not skip the browsers. An empty hit flag fails open to a full install.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.playwright-path.outputs.path }}
          key: ms-playwright-v1-${{ runner.os }}-${{ steps.playwright-path.outputs.image-os }}-${{ hashFiles('package-lock.json') }}
      - name: Restore the browsers' OS packages
        id: apt-debs-cache
        # The .deb files apt-get downloaded for the browsers last time. A miss or a cache outage only means apt
        # downloads them again.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.playwright-path.outputs.debs }}
          key: apt-debs-v1-${{ steps.playwright-path.outputs.image-os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        id: playwright-install
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/ci-playwright-install.mjs --cache-hit "${{ steps.playwright-cache.outputs.cache-hit }}" --debs "${{ steps.playwright-path.outputs.debs }}"
      - name: Retry Playwright browser install
        id: playwright-install-retry
        if: steps.playwright-install.outcome == 'failure'
        timeout-minutes: 8
        run: node scripts/ci-playwright-install.mjs --cache-hit "${{ steps.playwright-cache.outputs.cache-hit }}" --debs "${{ steps.playwright-path.outputs.debs }}"
      - name: Save Playwright browsers
        # Four shards miss together and would all try to write one key. A lost race must not fail the tests.
        # The save also waits until an install attempt actually succeeded, so a partial download is not cached.
        continue-on-error: true
        if: >-
          steps.playwright-cache.outputs.cache-hit != 'true'
          && steps.playwright-cache.outputs.cache-primary-key != ''
          && (steps.playwright-install.outcome == 'success' || steps.playwright-install-retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.playwright-path.outputs.path }}
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Save the browsers' OS packages
        # Only after an install succeeded, so the cache holds a whole set.
        continue-on-error: true
        if: >-
          steps.apt-debs-cache.outputs.cache-hit != 'true'
          && steps.apt-debs-cache.outputs.cache-primary-key != ''
          && (steps.playwright-install.outcome == 'success' || steps.playwright-install-retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.playwright-path.outputs.debs }}
          key: ${{ steps.apt-debs-cache.outputs.cache-primary-key }}
      # WP-03: Hivra's one layout, in the app built with the Hub flag (the default config runs without it).
      - name: Hivra layout (Hub flag)
        if: matrix.shard == 1
        run: npx playwright test -c tests/browser/hivra-layout.config.ts
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/6
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  host:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PRs and pushes run on Linux (fast, and no wait for the 5 macOS runners); the pre-ship run (workflow_dispatch)
        # uses macOS. Windows is off while the app is Mac-only (Ash, 11 Nov 2026); HUB_CROSS_PLATFORM_CI=true runs all three.
        os: ${{ fromJSON(vars.HUB_CROSS_PLATFORM_CI == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || github.event_name == 'workflow_dispatch' && '["macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: node --test host/runtime-download.test.mjs
      - name: Cache pinned host runtimes
        uses: actions/cache@v4
        with:
          path: build/host-runtime-cache
          key: host-runtime-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('host/package.mjs') }}
      - run: npm run host:package

  check:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Hivra: the web tests and the Rust checks ran one after the other in one job (about 24 minutes on Windows).
    # On Linux and Windows they now run as separate jobs, and Windows splits the web tests in two (vitest --shard).
    # macOS stays one runner. When every OS runs, the web half and the Rust half run at the same time in that job,
    # because a second macOS runner would sit in the queue. By default (11 Nov 2026) macOS runs only the Rust half.
    name: check (${{ matrix.os }}, ${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is off while the app is Mac-only (Ash, 11 Nov 2026). Set the repository variable
        # HUB_CROSS_PLATFORM_CI to true to run it again.
        # By default the web half (vitest and tsc, which test no OS) runs on two Linux runners and macOS runs only the
        # Rust half. On 11 Nov 2026 the macOS job ran both halves on one 3-core runner: vitest took 25 minutes there
        # against 6 on Linux, and the Rust tests waited behind it, so every PR waited 27 minutes for that one job.
        # The Rust half stays on macOS: on Linux it needs the WebKitGTK packages from Ubuntu's mirror, and on
        # 11 Nov 2026 that mirror stopped resolving from GitHub's runners for hours, failing every Linux job that
        # installs packages. The host and ship tests need no packages, so they run on Linux on a PR.
        include: ${{ fromJSON(vars.HUB_CROSS_PLATFORM_CI == 'true' && '[{"os":"macos-latest","part":"all"},{"os":"ubuntu-latest","part":"web"},{"os":"ubuntu-latest","part":"rust"},{"os":"windows-latest","part":"web","shard":"1/2"},{"os":"windows-latest","part":"web","shard":"2/2"},{"os":"windows-latest","part":"rust"}]' || '[{"os":"ubuntu-latest","part":"web","shard":"1/2"},{"os":"ubuntu-latest","part":"web","shard":"2/2"},{"os":"macos-latest","part":"rust"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux' && matrix.part != 'web'
        run: bash scripts/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.part != 'web'
        with:
          components: rustfmt, clippy

      # Saved only from main, so a PR starts from main's compiled dependencies and never evicts them with its own.
      - uses: Swatinem/rust-cache@v2
        if: matrix.part != 'web'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # WP-173: pinned installer, pinned nextest. No new permissions and no secrets.
      - name: Install cargo-nextest
        if: matrix.part != 'web'
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.151

      - run: npm ci
      - run: npm test ${{ matrix.shard && format('-- --shard={0}', matrix.shard) || '' }}
        if: matrix.part == 'web'
      - run: npx tsc --noEmit
        if: matrix.part == 'web'
      - run: cargo fmt --check
        if: matrix.part == 'rust'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.part == 'rust'
      - run: cargo nextest run --workspace --profile ci
        if: matrix.part == 'rust'
      - name: Web and Rust checks together
        if: matrix.part == 'all'
        run: node scripts/ci-check-parallel.mjs

      # WP-173: list flaky and twice-failed tests. The script exits 0, so it does not change the job result.
      - name: Rust flaky tests in the job summary
        if: always() && matrix.part != 'web'
        run: node scripts/ci-rust-flaky-summary.mjs

      - name: Upload Rust test results
        if: always() && matrix.part != 'web'
        uses: actions/upload-artifact@v4
        with:
          name: rust-junit-${{ matrix.os }}-${{ matrix.part }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  ship:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Ship drill
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PRs and pushes run on Linux (fast, and no wait for the 5 macOS runners); the pre-ship run (workflow_dispatch)
        # uses macOS. Windows is off while the app is Mac-only; HUB_CROSS_PLATFORM_CI=true runs all three.
        os: ${{ fromJSON(vars.HUB_CROSS_PLATFORM_CI == 'true' && '["macos-latest","ubuntu-latest","windows-latest"]' || github.event_name == 'workflow_dispatch' && '["macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suite runs `hub-ship.mjs --drill-rollback` with no --launcher, under the
      # temporary HOME `world()` makes. HOME and USERPROFILE here are also temporary,
      # so a drill cannot fall through to the runner's real profile on any OS.
      - name: hub:ship -- --drill-rollback under a temporary HOME
        timeout-minutes: 10
        env:
          HOME: ${{ runner.temp }}/monocode-hub-ship-home
          USERPROFILE: ${{ runner.temp }}/monocode-hub-ship-home
        run: node --disable-warning=ExperimentalWarning --test scripts/hub-ship.test.mjs scripts/ship-platform.test.mjs

  appimage:
    # Linux packaging is off while the app is Mac-only; HUB_CROSS_PLATFORM_CI=true runs it again.
    if: vars.HUB_CROSS_PLATFORM_CI == 'true' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: AppImage host libraries
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # A full tauri release build is too expensive for every PR. Run when
    # packaging inputs change; the release linux job still always asserts.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip unless packaging files changed
        id: packaging
        run: |
          set -euo pipefail
          pattern='^(scripts/repack-appimage\.sh|scripts/assert-appimage-host-libs\.sh|scripts/install-linux-deps-debian\.sh|package\.json|package-lock\.json|Cargo\.lock|src-tauri/tauri\.conf\.json|src-tauri/tauri\.linux\.conf\.json|src-tauri/Cargo\.toml|\.github/workflows/(ci|release)\.yml)$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve $base; building AppImage."
            exit 0
          fi
          changed="$(mktemp)"
          git diff --name-only --no-renames "$base" "${{ github.sha }}" > "$changed"
          if grep -Eq "$pattern" "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Packaging files unchanged; skipping AppImage build."
          fi

      - uses: actions/setup-node@v4
        if: steps.packaging.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.packaging.outputs.run == 'true'

      - name: Install Linux system dependencies
        if: steps.packaging.outputs.run == 'true'
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci
        if: steps.packaging.outputs.run == 'true'

      - name: Build Linux packages
        if: steps.packaging.outputs.run == 'true'
        run: npm run build:linux

      - name: Assert AppImage uses host libraries
        if: steps.packaging.outputs.run == 'true'
        run: bash scripts/assert-appimage-host-libs.sh

  # Every run builds one RPM image, the image the release workflow publishes from, so a production build runs on every
  # pull request. The full set (the second image and the clean install) runs on every push to main, every nightly run,
  # and every pull request whose base-sha diff touches an RPM input, the same idea as the AppImage job. The script
  # prints full=true or full=false. A missing event, a missing base or a git failure prints full=true.
  rpm-changes:
    # Linux packaging is off while the app is Mac-only; HUB_CROSS_PLATFORM_CI=true runs it again. The rpm build and
    # the clean install need this job, so they skip with it.
    if: vars.HUB_CROSS_PLATFORM_CI == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: RPM packaging changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.packaging.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decide whether the full RPM set runs
        id: packaging
        env:
          PACKAGING_EVENT: ${{ github.event_name }}
          PACKAGING_BASE: ${{ github.event.pull_request.base.sha }}
          PACKAGING_HEAD: ${{ github.sha }}
        run: node scripts/ci-packaging-changed.mjs --kind rpm >> "$GITHUB_OUTPUT"

  rpm:
    needs: rpm-changes
    # The production build: tauri's release build and the rpm bundle. It no longer waits for the gate's answer, only
    # for the gate to have run. The gate's answer picks the images.
    if: >-
      needs.rpm-changes.result == 'success'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: RPM build (${{ matrix.image }})
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # almalinux:10 is the image release.yml builds the published rpm on, so every run builds it. It also covers
        # the Enterprise Linux path in scripts/install-linux-deps-fedora.sh (EPEL 10 + CRB), which is the only way to
        # catch packages that are missing from EPEL 10. fedora:43 joins it when the gate says full.
        image: ${{ fromJSON(needs.rpm-changes.outputs.full == 'true' && '["almalinux:10","fedora:43"]' || '["almalinux:10"]') }}
    steps:
      # 11 Nov 2026: an AlmaLinux mirror sent packages at a few KB/s and several runs hit the 25 minute limit
      # in "Install git". dnf only drops a mirror slower than 1 KB/s; this drops one under 100 KB/s for 15 seconds and
      # tries the next, and fetches in parallel. It changes no package, only where they come from.
      - name: Skip slow package mirrors
        run: |
          grep -q '^\[main\]' /etc/dnf/dnf.conf || echo '[main]' >> /etc/dnf/dnf.conf
          printf 'minrate=100k\ntimeout=15\nmax_parallel_downloads=10\n' >> /etc/dnf/dnf.conf

      # Neither fedora:43 nor almalinux:10 ships git, which actions/checkout
      # otherwise has to work around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build:fedora

      - name: Install the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, so assert the runtime stack is declared.
          # The install below cannot prove this on its own: the setup script has
          # already installed every -devel package.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          echo "$requires"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          command -v monocode

      - name: Upload rpm for the clean install check
        # Ship and test the EL 10 build. Fedora 43's glibc is newer, so a
        # fedora:43 rpm can dnf-install on AlmaLinux 10 and still fail to load.
        # The clean install runs only for the full set, so only that run uploads.
        if: matrix.image == 'almalinux:10' && needs.rpm-changes.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  rpm-clean-install:
    name: Clean rpm install
    needs: [rpm-changes, rpm]
    # Part of the full set. A run that built only the production image has no rpm to hand over, so this skips.
    # With no status function in the condition, a failed or skipped rpm job skips this one too.
    if: needs.rpm-changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Deliberately no setup script: this is the only job that can catch an rpm
    # whose Requires are missing, since everywhere else the -devel packages are
    # already installed. It mirrors the README instructions for an EL 10 user.
    # ldd -r is the loader check: dnf install succeeding does not prove the
    # binary can resolve against EL 10's glibc and runtime libraries.
    container: almalinux:10
    steps:
      # 11 Nov 2026: an AlmaLinux mirror sent packages at a few KB/s and several runs hit the 25 minute limit
      # in "Install git". dnf only drops a mirror slower than 1 KB/s; this drops one under 100 KB/s for 15 seconds and
      # tries the next, and fetches in parallel. It changes no package, only where they come from.
      - name: Skip slow package mirrors
        run: |
          grep -q '^\[main\]' /etc/dnf/dnf.conf || echo '[main]' >> /etc/dnf/dnf.conf
          printf 'minrate=100k\ntimeout=15\nmax_parallel_downloads=10\n' >> /etc/dnf/dnf.conf

      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable EPEL 10
        run: dnf install -y epel-release

      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpm

      - name: Install the rpm on a clean image
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          dnf install -y "${bundle[0]}"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3; do
            rpm -q "$dep" >/dev/null || { echo "dnf did not install $dep" >&2; exit 1; }
          done
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          test -x /usr/bin/monocode
          # ldd -r can exit non-zero on GTK/WebKit plugin symbols; fail only
          # when a library or GLIBC version is actually missing.
          loader_output="$(ldd -r /usr/bin/monocode 2>&1 || true)"
          printf '%s\n' "$loader_output"
          if grep -q 'not found' <<<"$loader_output"; then
            echo "monocode cannot load on EL 10" >&2
            exit 1
          fi

  # WP-105: one required check that adds up the rest, so branch protection names one job instead of
  # every job. A new job stays out of this needs list until it has been green for a week. `if: always()`
  # means a failed or cancelled dependency still runs this job, so the failure is reported here too.
  # Skipped counts as fine: a draft PR runs no jobs, a PR runs no browser tests, the AppImage check and the RPM full set skip when packaging
  # files did not change, and a nightly run starts only the RPM jobs. scripts/ci-ok.mjs prints one line naming
  # every job and its result.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [release-channel, mobile, browser, host, check, ship, appimage, rpm-changes, rpm, rpm-clean-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ok.mjs
